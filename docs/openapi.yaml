openapi: 3.0.3
info:
  title: Hooshyar AI Chat Platform API
  version: 1.0.0
  description: |
    API contract for the multi-model AI chat platform MVP (Persian-first, RTL).

    **Base conventions**

    * All timestamps are ISO-8601 UTC strings (`format: date-time`).
        * All ids are UUID v4 strings, EXCEPT theme ids — stable registry keys
      (`light` | `dark` | `midnight`) shared with the frontend `data-theme` attribute.
    * All endpoints require a Bearer JWT **except** `register`, `login`, the
      payment webhook (HMAC-authenticated) and `GET /themes/available`.
    * JWTs expire after 24 hours. When expired or invalid, every protected
      endpoint returns `401 UNAUTHENTICATED`.

    **Error contract**

    Every non-2xx JSON response uses one envelope:

    ```json
    { "error": { "code": "RESOURCE_NOT_FOUND", "message": "گفتگو پیدا نشد." } }
    ```

    `code` is machine-readable (stable, for frontend branching); `message` is a
    Persian, user-displayable string. Provider internals (names, hosts, HTTP
    codes, timeouts) never appear in any response.

    **Streaming (POST /conversations/{id}/messages)**

    Success responds `200` with `text/event-stream` (SSE over POST because
    EventSource cannot send an Authorization header or a body). Pre-stream
    validation failures (auth, ownership, model resolution, message validation)
    return the standard JSON error responses below — **not** SSE events. Once
    the stream opens, exactly one terminal event (`done` or `error`) is emitted:

    ```
    event: meta   data: {"userMessage": {...}, "model": {...}}   # once, first
    event: delta  data: {"text": "chunk"}                        # 0..n times
    event: done   data: {"assistantMessage": {...}}              # terminal (success)
    event: error  data: {"message": "سرویس ... موقتاً در دسترس نیست."} # terminal (failure)
    ```

    On the `error` event the backend has already persisted exactly one
    assistant message with `status = "failed"` containing any partial content.

    Client disconnects (network drop, tab close) do NOT emit an `error` event
    — the disconnector cannot receive it, and disconnect ≠ failure: the
    generation keeps running server-side. The Stop button is different — it
    calls `POST /conversations/{id}/messages/stop`, which aborts the provider
    request, persists the partial answer with `status = "interrupted"`
    (`errorMessage = null`) and emits a terminal `cancelled` event to every
    other attached stream. A stopped turn is never auto-resumed; the next
    `GET` on the conversation surfaces the row as a Retry target. See
    `docs/CONVERSATION_RESILIENCE.md` §5/§5.1.

    **Business rules not expressible as schema constraints**

    * BR-4: message content must be non-blank after trim and at most 4000 chars.
    * BR-5/INV-3: at most one default model exists and it is active; the
      default swap is atomic.
    * BR-6/INV-4: the default model cannot be deactivated or deleted until
      another model is default; inactive models are never usable for a chat turn.
    * BR-7: the first active model created becomes the default automatically.
    * BR-8/INV-5: one logical assistant message per turn, in every outcome.
    * A-7: the conversation title is auto-set from the first message
      (truncated to 200 chars) if the title is still the default.

    **Collections** are plain JSON arrays — no pagination, filtering, or
    sorting parameters in the MVP (by design decision A-9).

servers:
  - url: http://localhost:4000/api
    description: Backend (development)
  - url: http://localhost:5200/api
    description: Through the Vite dev proxy (frontend development)

tags:
  - name: Auth
    description: Registration and login. Public endpoints.
  - name: Conversations
    description: Conversation list, creation, and history retrieval.
  - name: Chat
    description: Sending messages and receiving streamed AI answers.
  - name: Models
    description: Active model discovery for the chat UI.
  - name: Admin Models
    description: Model lifecycle management. Requires the `admin` role.

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new user account
      description: |
        Creates a user account with role `user`. Emails are normalized
        (trimmed, lower-cased) before the uniqueness check. Passwords are
        stored as bcrypt hashes only (INV-2) and never returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              valid:
                value: { email: 'sara@example.com', password: 'password123' }
      responses:
        '201':
          description: Account created; the user is immediately authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: 'این ایمیل قبلاً ثبت شده است.'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Returns a JWT and the user profile. Unknown email and wrong password
        return the **same** error (BR-9) so accounts cannot be enumerated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials (identical for unknown email and wrong password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 'ایمیل یا رمز عبور اشتباه است.'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List the caller's conversations
      description: Returns only conversations owned by the authenticated user (INV-1), newest first. Unpaginated by design.
      responses:
        '200':
          description: Conversation collection (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a conversation
      description: Creates a conversation owned by the caller. Omit the body (or send `{}`) to use the default title.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation with its messages
      description: |
        Returns the conversation and its full message history (oldest first).
        A conversation owned by another user responds exactly like a
        nonexistent one (404) — no existence leak (INV-1, INV-9).
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation with messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{conversationId}/model:
    patch:
      tags: [Conversations]
      operationId: setConversationModel
      summary: Persist the conversation's selected model
      description: |
        Stores (or clears) the conversation's explicitly selected model — the
        value clients restore after a refresh or a conversation switch, in
        precedence over the system default. The model must pass the same
        checks a chat send enforces (exists, active, allowed for the caller's
        plan; the thinking gate is waived for admins). `modelId: null` clears
        the explicit selection so the conversation follows the default again.
        Foreign conversations respond with 404 (no existence leak).
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Model id to persist, or null to clear the explicit selection.
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{conversationId}/messages:
    post:
      tags: [Chat]
      operationId: sendMessage
      summary: Send a message and stream the AI answer (SSE)
      description: |
        Persists the user message, resolves the model (explicit `modelId`
        when provided and active, otherwise the default model), calls the AI
        provider, and streams the answer back as Server-Sent Events.

        **Order of checks (all pre-stream, returning normal JSON errors):**
        1. auth → `401`
        2. UUID shape → `400 VALIDATION_ERROR`
        3. message validation → `400 VALIDATION_ERROR`
        4. conversation exists **and** belongs to caller → `404 RESOURCE_NOT_FOUND`
        5. model resolution: unknown id → `404`; inactive id → `400 MODEL_INACTIVE`;
           no default configured → `400 NO_DEFAULT_MODEL`
        6. plan allowlist / feature entitlements → `403`
        7. `webSearch: true` with the search switch off → `503 SEARCH_DISABLED`
        8. `webSearch: true` on a model without the `web-search` capability →
           `400 CAPABILITY_UNSUPPORTED` (model-state: admins are NOT exempt)
        9. idempotency replay detection (replays skip the quota check)
        10. daily quota exhausted → `429 QUOTA_EXCEEDED`

        Then the stream opens (see the Streaming section in the API info):
        `meta` → (`search_started` → `search_completed` → `sources`)? →
        `status`* → `delta`* → `done` | `cancelled` | `failed`. Exactly one
        assistant message
        is persisted per turn in every outcome (INV-5). The provider request is
        aborted after the configured timeout (A-8, default 60s) and surfaces as
        the generic `failed` terminal event — unless the model carries a
        single-hop fallback and the failure was retryable BEFORE the first
        token, in which case the turn restarts once on the fallback model
        (announced via `status {generating, detail: "fallback"}`).

        The generation runs DETACHED from this HTTP response: a client
        disconnect (refresh, closed tab, network loss) only unsubscribes — the
        AI keeps generating and the row completes in the DB. A returning
        client re-attaches via
        `/conversations/{conversationId}/messages/{messageId}/stream`.

        The first message of an untitled conversation auto-sets its title (A-7).
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              defaultModel:
                value: { content: 'سلام، یک ایده برای پروژه بده.' }
              explicitModel:
                value:
                  content: 'Explain this code.'
                  modelId: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'
      responses:
        '200':
          description: |
            SSE stream (`text/event-stream`). Event payloads use the
            `StreamMetaEvent`, `StreamStatusEvent`, `StreamSourcesEvent`,
            `StreamDeltaEvent`, `StreamDoneEvent`, and `StreamFailedEvent`
            schemas documented in components. Web-search turns additionally
            carry `search_started` / `search_completed` events before the
            first delta.

            Disconnect handling: disconnect ≠ failure. The generation is
            detached from the HTTP connection, so a mid-stream disconnect only
            unsubscribes the client — the generation continues, keeps
            persisting progress, and finishes `completed`. No error event is
            emitted to the disconnector (it cannot receive one). Provider /
            network failures persist with `status = "failed"` and emit a
            generic `StreamFailedEvent`. See
            `docs/CONVERSATION_RESILIENCE.md` §5 for the disambiguation.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: meta
                data: {"userMessage":{"id":"e083f38c-155a-4ada-a85a-e04191d71831","conversationId":"3f7a9529-fcc2-4d6d-9723-ac6d69f928af","role":"user","content":"سلام","status":null,"errorMessage":null,"modelId":null,"clientMessageId":"cm-l8x9k-3a7b","createdAt":"2026-09-14T13:38:01.304Z"},"assistantMessage":{"id":"17d53156-1e46-4c61-b444-3ba9506b2d0b","conversationId":"3f7a9529-fcc2-4d6d-9723-ac6d69f928af","role":"assistant","content":"","status":"pending","errorMessage":null,"modelId":"84bc6ca9-b6c2-485f-828f-a48c32524759","clientMessageId":null,"createdAt":"2026-09-14T13:38:01.310Z"},"model":{"id":"84bc6ca9-b6c2-485f-828f-a48c32524759","name":"Mock GPT","provider":"mock"},"replay":false}

                event: delta
                data: {"text":"سلام! "}

                event: delta
                data: {"text":"این یک پاسخ آزمایشی است."}

                event: done
                data: {"assistantMessage":{"id":"17d53156-1e46-4c61-b444-3ba9506b2d0b","conversationId":"3f7a9529-fcc2-4d6d-9723-ac6d69f928af","role":"assistant","content":"سلام! این یک پاسخ آزمایشی است.","status":"completed","errorMessage":null,"modelId":"84bc6ca9-b6c2-485f-828f-a48c32524759","clientMessageId":null,"createdAt":"2026-09-14T13:38:03.352Z"}}
        '400':
          description: 'Validation failure, inactive model, no default model, capability unsupported by the model, or idempotency content collision. Codes: `VALIDATION_ERROR`, `MODEL_INACTIVE`, `NO_DEFAULT_MODEL`, `CAPABILITY_UNSUPPORTED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Model not allowed for the caller's plan / entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown/foreign conversation or unknown model id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Daily message or token quota exhausted (admins and idempotent
            replays are exempt). Persian body:
            «سهمیه پیام‌های امروز شما تمام شده است.»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`webSearch: true` while the platform search switch (`WEB_SEARCH_ENABLED`) is off. Persian body: «جستجوی وب فعال نیست.»'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{conversationId}/messages/stop:
    post:
      tags: [Chat]
      operationId: stopGeneration
      summary: Stop the conversation's active AI generation (Stop button)
      description: |
        Cancels the conversation's in-flight generation end-to-end: aborts the
        underlying provider request, discards every token that arrives after
        the abort, persists the partial assistant row with
        `status = "interrupted"` (`errorMessage = null`), and emits a terminal
        `cancelled` SSE event to every attached stream.

        - Idempotent: repeated calls never touch completed/failed/interrupted
          rows and return `stopped: false` once nothing is open.
        - Ownership-checked — a caller can only stop a generation in their own
          conversation, never another user's.
        - Cancellation is never classified as provider failure and never
          routed into the single-hop fallback (a stopped turn stays stopped).
        - The response waits (bounded, `AI_STOP_SETTLE_TIMEOUT_MS`, default
          5s) for the deterministic terminal row; if natural completion won
          the race, `message.status` is `"completed"`.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: |
            Stop result. `stopped` is false when the conversation had no open
            generation. `message` is the authoritative final assistant row
            (or null when nothing was stopped).
          content:
            application/json:
              schema:
                type: object
                required: [stopped, message]
                properties:
                  stopped:
                    type: boolean
                  message:
                    oneOf:
                      - $ref: '#/components/schemas/Message'
                      - type: 'null'
              example:
                stopped: true
                message:
                  id: 17d53156-1e46-4c61-b444-3ba9506b2d0b
                  conversationId: 3f7a9529-fcc2-4d6d-9723-ac6d69f928af
                  role: assistant
                  content: 'سلام! این بخش'
                  status: interrupted
                  errorMessage: null
                  modelId: 84bc6ca9-b6c2-485f-828f-a48c32524759
                  clientMessageId: null
                  createdAt: '2026-09-20T15:38:03.352Z'
        '400':
          description: Invalid conversation id (UUID shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or foreign conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/messages/{messageId}/stream:
    get:
      tags: [Chat]
      operationId: reconnectGenerationStream
      summary: Reconnect to an assistant message's generation (SSE recovery stream)
      description: |
        Recovery stream for a client that lost its live connection — refresh
        mid-stream, closed tab, restored network, or a second tab opening the
        same conversation. Never re-invokes the AI:

        - live generation → `StreamSnapshotEvent` + remaining
          `StreamDeltaEvent`s + `StreamDoneEvent`/`StreamFailedEvent`/
          `StreamCancelledEvent` (the latter when the generation was stopped
          by the user, e.g. from another tab)
        - `completed` row → snapshot + done (pure replay)
        - `failed`/`interrupted` row → snapshot + `StreamFailedEvent`
        - `pending`/`streaming` row with NO live generation (server restarted
          mid-generation) → the row is honestly marked `interrupted` in the DB,
          then snapshot + `StreamFailedEvent`; the client can retry

        Subscribe-first/snapshot-second ordering guarantees no token is lost
        or duplicated: snapshot + deltas concatenate exactly to the persisted
        content.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            SSE stream (`text/event-stream`): `snapshot` → `delta`* →
            `done` | `cancelled` | `failed`.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: snapshot
                data: {"assistantMessage":{"id":"17d53156-1e46-4c61-b444-3ba9506b2d0b","role":"assistant","content":"سلام! این یک","status":"streaming","errorMessage":null}}

                event: delta
                data: {"text":"پاسخ آزمایشی است."}

                event: done
                data: {"assistantMessage":{"id":"17d53156-1e46-4c61-b444-3ba9506b2d0b","role":"assistant","content":"سلام! این یک پاسخ آزمایشی است.","status":"completed","errorMessage":null}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown/foreign conversation, or the message is not an assistant row of it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /models:
    get:
      tags: [Models]
      operationId: listAvailableModels
      summary: List models available to the caller's plan
      description: |
        Plan-filtered for the chat picker: only models the caller is
        authorized to use — currently `isActive = true` AND `isFree = true`
        (the FREE plan is the only plan in the MVP). Inactive or premium
        models are never included; the backend is the authorization source
        of truth, not the frontend. Provider API keys are never included in
        any model response.
      responses:
        '200':
          description: Active model collection (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/models:
    get:
      tags: [Admin Models]
      operationId: adminListModels
      summary: List all models (admin)
      description: All models regardless of state, oldest first. Requires role `admin` (INV-8).
      responses:
        '200':
          description: Model collection (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin Models]
      operationId: adminCreateModel
      summary: Create a model (admin)
      description: |
        Creates a model. The first active model created becomes the default
        automatically (BR-7); later models never steal the default flag.
        The provider API key (if given) is stored server-side and is never
        returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
            examples:
              mock:
                summary: Demo model, no key required
                value:
                  name: 'Mock GPT'
                  provider: 'mock'
                  externalModelId: 'mock-1'
              openai:
                summary: Real OpenAI-compatible model
                value:
                  name: 'GPT-4o mini'
                  provider: 'openai-compatible'
                  externalModelId: 'gpt-4o-mini'
                  baseUrl: 'https://api.openai.com/v1'
                  apiKey: 'sk-...'
      responses:
        '201':
          description: Model created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/models/{modelId}:
    patch:
      tags: [Admin Models]
      operationId: adminUpdateModel
      summary: Update a model (admin)
      description: |
        Partial update; unknown fields are rejected. Sending `isActive:
        false` or `isFree: false` for the current default model is refused
        (BR-6) until another model is made default first — the default must
        stay active AND free. At least one field must be provided.
      parameters:
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          description: Updated model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
        '400':
          description: 'Validation failure or protected default model. Codes: `VALIDATION_ERROR`, `DEFAULT_MODEL_PROTECTED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DEFAULT_MODEL_PROTECTED
                  message: 'مدل پیش‌فرض را نمی‌توان غیرفعال کرد. ابتدا یک مدل دیگر را پیش‌فرض کنید.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin Models]
      operationId: adminDeleteModel
      summary: Delete a model (admin)
      description: |
        Deletes a non-default model. Deleting the default model is refused
        (BR-6). Historical messages referencing a deleted model keep their
        content; their `modelId` becomes `null` (FK ON DELETE SET NULL).
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '204':
          description: Deleted. No response body.
        '400':
          description: 'Protected default model. Code: `DEFAULT_MODEL_PROTECTED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/models/{modelId}/default:
    post:
      tags: [Admin Models]
      operationId: adminSetDefaultModel
      summary: Set the default model (admin)
      description: |
        Atomically makes this model the single default (clear-all + set-one,
        BR-5). The target must exist and be active. After this call exactly
        one default model exists (INV-3). Runtime configuration only — no
        redeploy required.
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: The model is now the default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
        '400':
          description: 'Model is inactive. Code: `MODEL_INACTIVE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: MODEL_INACTIVE
                  message: 'فقط مدل فعال می‌تواند پیش‌فرض شود.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /usage/me:
    get:
      tags: [usage]
      summary: Quota/usage snapshot for the signed-in user
      description: |
        Source for the sidebar quota line and the composer lock. Counted
        against the current UTC day; usage rows with outcome `failed` do not
        count. Admins bypass quotas and receive `quota: null`.
      responses:
        '200':
          description: Plan, configured limits and today's consumption.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          description: Missing/invalid JWT.

  /admin/users:
    get:
      tags: [admin-users]
      summary: List users (admin)
      responses:
        '200':
          description: All users, oldest first (no secrets).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '403':
          description: Caller is not an admin.

  /admin/users/{userId}/plan:
    patch:
      tags: [admin-users]
      summary: Change a user's plan (admin)
      description: |
        Takes effect on the affected user's NEXT request — the plan is read
        fresh from the DB per send, never from the JWT. Setting the current
        plan is an idempotent no-op.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [free, premium]
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400': { description: Invalid plan value. }
        '403': { description: Caller is not an admin. }
        '404': { description: Unknown user. }

  /admin/usage/summary:
    get:
      tags: [admin-usage]
      summary: Consumption & cost overview (admin)
      description: |
        Totals plus per-day / per-model / per-user aggregation over the last
        `days` days (1–90, default 7). ALL outcomes are included — cost
        reporting shows real consumption even for failed turns (the
        failed-outcome exclusion applies only to quota counting). `cost` is
        0 for turns whose model has no pricing or was deleted.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: Aggregated usage and cost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsageSummary'
        '403':
          description: Caller is not an admin.

  # ---- Billing (day 9-10) ----
  /billing/plans:
    get:
      tags: [billing]
      summary: List active plans
      responses:
        '200':
          description: Active plans, cheapest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '401': { description: Missing/invalid JWT. }

  /billing/subscription/me:
    get:
      tags: [billing]
      summary: Current entitlements + active subscription
      description: |
        The server-resolved access snapshot (INV-05): resolved FRESH from the
        subscription/plan rows per request, never from the JWT. An overdue
        period is lazily expired here (INV-06) before it can grant anything.
        Users without an active subscription get the env-configured free tier.
      responses:
        '200':
          description: Entitlement snapshot + subscription row (null when none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionOverview'
        '401': { description: Missing/invalid JWT. }

  /billing/subscription/cancel:
    post:
      tags: [billing]
      summary: Cancel the active subscription (immediate, no proration)
      responses:
        '200':
          description: Fresh entitlements/subscription after cancellation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionOverview'
        '401': { description: Missing/invalid JWT. }

  /billing/payments:
    get:
      tags: [billing]
      summary: Caller's payment history (newest first)
      responses:
        '200':
          description: Owned payments only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPaymentView'
        '401': { description: Missing/invalid JWT. }
    post:
      tags: [billing]
      summary: Start a checkout (creates a PENDING payment)
      description: |
        The amount/currency are resolved from the Plan row server-side — any
        client-sent money fields are ignored (anti price manipulation). A
        second PENDING payment for the same (user, plan) returns the existing
        one (double-click dedupe; backed by a partial unique index).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, format: uuid }
      responses:
        '201':
          description: The (possibly pre-existing) pending payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPaymentView'
        '401': { description: Missing/invalid JWT. }
        '404': { description: Unknown plan. }
        '409': { description: Plan is deactivated (not purchasable). }

  /billing/payments/{paymentId}:
    get:
      tags: [billing]
      summary: Owned payment detail
      description: Another user's payment is a 404 — indistinguishable from a missing one (IDOR-safe).
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPaymentView'
        '401': { description: Missing/invalid JWT. }
        '404': { description: Unknown or foreign payment. }

  /billing/payments/{paymentId}/cancel:
    post:
      tags: [billing]
      summary: Abort a pending checkout
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment in status `cancelled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPaymentView'
        '401': { description: Missing/invalid JWT. }
        '404': { description: Unknown or foreign payment. }
        '409': { description: Payment already terminal (state machine). }

  /billing/payments/{paymentId}/simulate:
    post:
      tags: [billing]
      summary: MVP gateway simulator — run a scenario through the real webhook pipeline
      description: |
        Produces gateway-shaped, correctly-signed events and feeds them to the
        same processing pipeline as POST /billing/webhook. To be replaced by a
        real gateway integration; the webhook contract does not change.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: string
                  enum: [success, failed, cancelled, timeout, duplicate_webhook, retry, out_of_order, unknown]
      responses:
        '200':
          description: Scenario result + the fresh payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '401': { description: Missing/invalid JWT. }
        '404': { description: Unknown or foreign payment. }

  /billing/webhook:
    post:
      tags: [webhook]
      summary: Payment gateway callback (PUBLIC — HMAC authenticated)
      description: |
        Requires an HMAC-SHA256 hex signature over the exact raw request bytes
        in header `x-hooshyar-signature` (secret PAYMENT_WEBHOOK_SECRET).
        Idempotency: the (provider, eventId) pair occupies the inbox once —
        replays answer 200 duplicate with ZERO business effect; concurrent
        deliveries are serialized by a payment row lock and the state machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      parameters:
        - name: x-hooshyar-signature
          in: header
          required: true
          schema: { type: string }
          description: HMAC-SHA256 hex digest of the raw body.
      responses:
        '200':
          description: Acknowledged — status processed | duplicate | ignored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
        '400': { description: Malformed body (even with a valid signature). }
        '401': { description: Invalid or missing signature — nothing is persisted. }

  /admin/billing/plans:
    get:
      tags: [admin-billing]
      summary: List all plans incl. inactive (admin)
      responses:
        '200':
          description: All plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '403': { description: Caller is not an admin. }
    post:
      tags: [admin-billing]
      summary: Create a plan (admin)
      description: Adding a plan is data entry — no code change. `slug` is immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanPayload'
      responses:
        '201':
          description: The created plan (active by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '403': { description: Caller is not an admin. }
        '409': { description: Duplicate slug. }

  /admin/billing/plans/{planId}:
    patch:
      tags: [admin-billing]
      summary: Update a plan (admin)
      description: Price changes affect only FUTURE payments — history keeps its snapshot (INV-07).
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanPayload'
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '403': { description: Caller is not an admin. }
        '404': { description: Unknown plan. }

  /admin/billing/plans/{planId}/activate:
    post:
      tags: [admin-billing]
      summary: Activate a plan (admin)
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Plan state after activation. }
        '403': { description: Caller is not an admin. }
        '404': { description: Unknown plan. }

  /admin/billing/plans/{planId}/deactivate:
    post:
      tags: [admin-billing]
      summary: Deactivate a plan (admin)
      description: |
        Stops new purchases. Existing active subscriptions run to their period
        end (documented policy) and historical payments are untouched.
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Plan state after deactivation. }
        '403': { description: Caller is not an admin. }
        '404': { description: Unknown plan. }

  /admin/billing/payments:
    get:
      tags: [admin-billing]
      summary: List payments (admin)
      parameters:
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, success, failed, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Full payment rows (userId + plan snapshot included).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPayment'
        '403': { description: Caller is not an admin. }

  /admin/billing/subscriptions:
    get:
      tags: [admin-billing]
      summary: List subscriptions (admin)
      parameters:
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, active, expired, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Subscription rows, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSubscriptionRow'
        '403': { description: Caller is not an admin. }

  /admin/billing/audit:
    get:
      tags: [admin-billing]
      summary: Append-only audit trail (admin, read-only)
      parameters:
        - { name: eventType, in: query, schema: { type: string, example: payment.succeeded } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Audit entries, newest first. Metadata never contains secrets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        '403': { description: Caller is not an admin. }
  # ---- Themes (day: theme management, 2026-09-20) ----
  /themes/available:
    get:
      tags: [themes]
      summary: Enabled themes in display order (PUBLIC)
      description: |
        Public — pre-login pages theme themselves too. Returns the
        admin-controlled availability list: exactly one row has
        `isDefault: true` and it is always enabled (service invariant,
        auto-repaired on boot). Frontends must not hardcode this list.
      responses:
        '200':
          description: Enabled themes ordered by `sortOrder`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theme'

  /users/me/preferences:
    get:
      tags: [preferences]
      summary: Server-synced preferences of the caller
      responses:
        '200':
          description: |
            `themeId: null` = the user never chose a theme (the client keeps
            its device-local choice). A stored theme that has since been
            disabled resolves to the system default BEFORE it is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401': { description: Missing/invalid JWT. }

  /users/me/preferences/theme:
    patch:
      tags: [preferences]
      summary: Store the caller's theme preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [themeId]
              properties:
                themeId: { type: string, enum: [light, dark, midnight] }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400': { description: Unknown or currently DISABLED theme — the disabled list is never selectable through the API. }
        '401': { description: Missing/invalid JWT. }

  /admin/themes:
    get:
      tags: [admin-themes]
      summary: All themes incl. disabled (admin)
      responses:
        '200':
          description: Full theme rows in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theme'
        '403': { description: Caller is not an admin. }

  /admin/themes/{themeId}:
    patch:
      tags: [admin-themes]
      summary: Edit display metadata (admin)
      description: '`enabled`/`isDefault` are NOT settable here — dedicated endpoints own their invariants. Unknown ids → 404.'
      parameters:
        - name: themeId
          in: path
          required: true
          schema: { type: string, enum: [light, dark, midnight] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemePayload'
      responses:
        '200':
          description: Updated row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
        '400': { description: Validation failure. }
        '403': { description: Caller is not an admin. }
        '404': { description: Unknown theme id. }

  /admin/themes/{themeId}/status:
    patch:
      tags: [admin-themes]
      summary: Enable or disable a theme (admin)
      description: |
        Invariants: at least one theme stays enabled (400 otherwise);
        disabling the current default auto-moves the default to the first
        remaining enabled theme within the same call.
      parameters:
        - name: themeId
          in: path
          required: true
          schema: { type: string, enum: [light, dark, midnight] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemeStatusPayload'
      responses:
        '200':
          description: Updated row (default already re-pointed when applicable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
        '400': { description: Would disable the last enabled theme. }
        '403': { description: Caller is not an admin. }
        '404': { description: Unknown theme id. }

  /admin/themes/{themeId}/default:
    post:
      tags: [admin-themes]
      summary: Set the global default theme (admin)
      description: Transactional swap — exactly one default, and a default is always enabled.
      parameters:
        - name: themeId
          in: path
          required: true
          schema: { type: string, enum: [light, dark, midnight] }
      responses:
        '200':
          description: The new default row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
        '400': { description: Theme is disabled — enable it first. }
        '403': { description: Caller is not an admin. }
        '404': { description: Unknown theme id. }

  /admin/themes/reorder:
    post:
      tags: [admin-themes]
      summary: Apply a new display order (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderThemesPayload'
      responses:
        '200':
          description: All themes in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theme'
        '400': { description: List must be a complete permutation of the registry ids (no duplicates, none missing). }
        '403': { description: Caller is not an admin. }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <accessToken> from register/login. Expires in 24h.'

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation UUID.
      schema:
        type: string
        format: uuid
    ModelId:
      name: modelId
      in: path
      required: true
      description: Model UUID.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional idempotency token. Mirror of `clientMessageId` on the request
        body — the backend accepts either, with the body field taking precedence
        when both are present. See `SendMessageRequest.clientMessageId` for the
        replay / 400 semantics.
      schema:
        type: string
        maxLength: 64

  responses:
    BadRequest:
      description: 'Invalid input (shape, format, blank content, bad UUID, etc.). Code: `VALIDATION_ERROR`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: 'متن پیام نمی‌تواند خالی یا فقط فاصله باشد.'
    Unauthorized:
      description: 'Missing, malformed, or expired token. Code: `UNAUTHENTICATED`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: 'توکن نامعتبر یا منقضی شده است.'
    Forbidden:
      description: 'Authenticated but not an admin. Code: `FORBIDDEN`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 'شما اجازه دسترسی به این بخش را ندارید.'
    NotFound:
      description: 'Unknown resource, or a resource owned by another user (indistinguishable). Code: `RESOURCE_NOT_FOUND`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: 'گفتگو پیدا نشد.'
    InternalError:
      description: 'Unexpected server error; details are logged server-side only. Code: `INTERNAL_ERROR`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: 'خطای غیرمنتظره‌ای رخ داد. لطفاً دوباره تلاش کنید.'

  schemas:
    # ---- Auth ----
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalized (trimmed, lower-cased) before uniqueness check.
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Minimum 8 characters (BR-2); max 72 (bcrypt input limit).

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 72

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 'JWT; send as `Authorization: Bearer <token>`.'
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]

    # ---- Conversations & messages ----
    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional; defaults to «گفتگوی جدید». Auto-set from the first message when left default (A-7).

    Conversation:
      type: object
      required: [id, title, userId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        userId:
          type: string
          format: uuid
          description: Owning user (INV — exactly one owner per conversation).
        modelId:
          type: string
          format: uuid
          nullable: true
          description: |
            The conversation's explicitly selected model (null = none chosen;
            sends then resolve the system default). Written only by
            PATCH /conversations/{conversationId}/model — never recomputed
            from the default — so clients restore it after a refresh.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Bumped on new messages; used for newest-first ordering.

    ConversationDetail:
      type: object
      required: [conversation, messages]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          description: Full history, oldest first. Unpaginated by design (A-9).
          items:
            $ref: '#/components/schemas/Message'

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: For assistant messages with a non-terminal or failure status, this is the partial answer (possibly empty).
        status:
          type: string
          enum: [pending, streaming, completed, interrupted, failed]
          nullable: true
          description: |
            `null` for user messages. For assistant messages:
              * `pending` — row pre-persisted before first AI byte.
              * `streaming` — AI is producing bytes (in-memory on the server).
              * `completed` — full success.
              * `interrupted` — client bailed out (network drop, tab close, Stop).
                No `error` SSE event is emitted for this case.
              * `failed` — provider / network failure (timeout, 5xx, refused).
            Full state machine: docs/CONVERSATION_RESILIENCE.md §3.
        errorMessage:
          type: string
          nullable: true
          description: Server-side detail for `failed` rows. Stored on the server for debugging; the SSE `error` event sends a generic Persian copy that is safe for the UI.
        modelId:
          type: string
          format: uuid
          nullable: true
          description: Model that produced an assistant message; `null` for user messages and for messages whose model was later deleted.
        clientMessageId:
          type: string
          maxLength: 64
          nullable: true
          description: |
            Idempotency token set by the client on the original POST. Present on
            user messages; used by the backend to recognize replays and to
            reject content collisions with HTTP 400.
        attachedFileIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: |
            READY files this USER turn attached as AI context (ids only) —
            the client renders attachment chips from these. `null` on
            assistant rows and turns without attachments.
        sources:
          type: array
          nullable: true
          maxItems: 5
          items:
            $ref: '#/components/schemas/MessageSource'
          description: |
            Web-search citations of THIS assistant turn (`null` on user rows
            and turns answered without search). Persisted on the row, so
            history reloads render citations without re-searching; also
            streamed live via the `sources` SSE event before the first delta.
        createdAt:
          type: string
          format: date-time

    MessageSource:
      type: object
      required: [title, url, domain, snippet]
      description: |
        One normalized search hit — safe to persist and to send to the
        client. Only `http:`/`https:` URLs are ever kept; duplicate URLs
        collapse deterministically at normalization time.
      properties:
        title:
          type: string
          maxLength: 200
        url:
          type: string
          description: Absolute http/https URL (validated server-side).
        domain:
          type: string
          description: Host without scheme/path (derived server-side, never trusted input).
        snippet:
          type: string
          maxLength: 500

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
          description: Non-blank after trim (BR-4); `pattern` requires at least one non-whitespace character.
        modelId:
          type: string
          format: uuid
          description: |
            Optional; must reference a model that is active and allowed for
            the caller's plan (active + free for FREE-plan users). Omit to
            use the default model. Authorization is re-verified on every
            send; a premium model requested by a FREE user is rejected with
            403 even via direct API calls.
        clientMessageId:
          type: string
          maxLength: 64
          description: |
            Optional idempotency token. The same value may also be sent as
            the `Idempotency-Key` HTTP header — both are accepted.
              * No matching row → new user message persisted with this id.
              * Match + matching content → replay (same user row, fresh
                assistant row, `meta.replay = true`).
              * Match + mismatched content → 400 in pre-flight
                (`این پیام قبلاً با متن دیگری ارسال شده است.`).
        webSearch:
          type: boolean
          default: false
          description: |
            Opt-in live web search for THIS turn. Pre-flight rejects the
            request with 503 when the platform search switch
            (`WEB_SEARCH_ENABLED`) is off, and with 400 when the resolved
            model's `capabilities` lack `web-search`. On success the turn
            streams `search_started` → `search_completed` → `sources` before
            the first `delta`; a failed search degrades to a normal turn
            (safe warning, never a failed turn).

    # ---- Models ----
    AiModel:
      type: object
      required: [id, name, provider, externalModelId, baseUrl, isActive, isFree, isDefault, hasApiKey, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        provider:
          type: string
          enum: [mock, openai-compatible, anthropic, google]
          description: One entry per registered adapter (backend/src/ai/adapters/).
        externalModelId:
          type: string
          maxLength: 200
          description: Model identifier at the provider (ignored by `mock`).
        baseUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Optional base URL override; `null` uses the adapter's provider default.
        capabilities:
          type: array
          items:
            type: string
            enum: [web-search, reasoning]
          description: |
            Declared capabilities from the closed set, validated at the admin
            boundary. Capabilities only unlock opt-in features; they never
            gate the base turn.
        fallbackModelId:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional single-hop fallback model (admin endpoints only; the
            user list carries `hasFallback`). Used once when this model's
            provider fails with a retryable kind (timeout / rate-limit /
            unavailable) before the first streamed token. Admin-boundary
            rules: must exist, be active, not be self, and be at least as
            accessible as this model.
        hasFallback:
          type: boolean
          description: True when a single-hop fallback model is configured.
        isActive:
          type: boolean
        isFree:
          type: boolean
          description: |
            Whether the model may be used by FREE-plan users. Independent of
            `isActive`: a free-configured model can be temporarily disabled.
        isDefault:
          type: boolean
          description: True for at most one model, and only while active AND free (INV-3).
        hasApiKey:
          type: boolean
          description: Whether a provider API key is stored. The key itself is never exposed.
        createdAt:
          type: string
          format: date-time

    CreateModelRequest:
      type: object
      required: [name, provider, externalModelId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          type: string
          enum: [mock, openai-compatible, anthropic, google]
        externalModelId:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          maxLength: 500
          description: Optional base URL override (adapter applies its provider default when omitted).
        apiKey:
          type: string
          maxLength: 500
          writeOnly: true
          description: Optional for `mock`; required in practice for real providers (enforced at call time as `invalid-config`, not creation).
        capabilities:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [web-search, reasoning]
        inputPricePerMillion:
          type: string
          description: Toman per 1M input tokens; empty/0 ⇒ not priced (cost null). Admin-only in responses.
        outputPricePerMillion:
          type: string
          description: Toman per 1M output tokens; empty/0 ⇒ not priced (cost null). Admin-only in responses.
        fallbackModelId:
          type: string
          format: uuid
          description: |
            Optional single-hop fallback model. Validated server-side: must
            exist, be active, not be self, and be at least as accessible as
            this model (400 otherwise).
        isActive:
          type: boolean
          default: true
        isFree:
          type: boolean
          default: true
          description: Whether FREE-plan users may use this model.

    UpdateModelRequest:
      type: object
      minProperties: 1
      description: Partial update; at least one field required. Unknown fields are rejected.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          type: string
          enum: [mock, openai-compatible, anthropic, google]
        externalModelId:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Send `null` to clear.
        apiKey:
          type: string
          maxLength: 500
          writeOnly: true
        capabilities:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [web-search, reasoning]
          description: Replaces the whole list on send.
        inputPricePerMillion:
          type: string
          nullable: true
        outputPricePerMillion:
          type: string
          nullable: true
        fallbackModelId:
          type: string
          format: uuid
          nullable: true
          description: |
            Single-hop fallback model; send `null` to clear. Invalid values
            (unknown / inactive / self / less accessible than this model)
            are refused with 400.
        isActive:
          type: boolean
        isFree:
          type: boolean
          description: |
            Toggle FREE-plan access. Removing free access from the current
            default model is refused (400) — the default must stay usable by
            FREE users.

    # ---- Streaming event payloads ----
    ModelSummary:
      type: object
      required: [id, name, provider]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum: [mock, openai-compatible, anthropic, google]

    StreamMetaEvent:
      type: object
      required: [userMessage, assistantMessage, model, replay]
      description: |
        First event; emitted once after the user message AND the assistant row
        (with `status = "pending"`) are persisted. `assistantMessage.id` is
        the real DB id — the client swaps its streaming placeholder for it
        immediately.
      properties:
        userMessage:
          $ref: '#/components/schemas/Message'
        assistantMessage:
          $ref: '#/components/schemas/Message'
        model:
          $ref: '#/components/schemas/ModelSummary'
        replay:
          type: boolean
          description: |
            `true` when the request was treated as a retry (the supplied
            `clientMessageId` matched an existing user row with the same
            content). `false` on the first send for a given id.
        webSearch:
          type: boolean
          description: |
            The SERVER's decision on whether the web-search phase is active
            for this turn (capability + plan + global switch). A client
            `webSearch: true` alone is never proof a search will run.

    StreamStatusEvent:
      type: object
      required: [status]
      description: |
        Execution-phase narration — safe labels about the system's own work,
        never model output and never chain-of-thought (provider reasoning
        channels are stripped inside the adapters). Ephemeral: not persisted,
        not replayed on reconnect. Appears only before the first `delta`
        (`generating` coincides with it). Additive: clients that do not know
        this event ignore it.
      properties:
        status:
          type: string
          enum: [thinking, generating]
          description: |
            `thinking` — provider warming up / reasoning before the first
            token. `generating` — first delta arrived (uniform signal).
        detail:
          type: string
          enum: [fallback]
          description: |
            `fallback` — the single-hop provider switch fired; the answer
            will come from the fallback model (the terminal row carries its
            real `modelId`).

    StreamSourcesEvent:
      type: object
      required: [sources]
      description: |
        Web-search citations of THIS turn, streamed once right after they
        were persisted — before the first `delta` — and forwarded to
        reconnecting subscribers. Duplicate URLs collapse deterministically;
        only http/https URLs are kept. Clients that miss the event lose
        nothing: the terminal row echoes `sources`.
      properties:
        sources:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MessageSource'

    StreamDeltaEvent:
      type: object
      required: [text]
      description: One answer chunk; zero or more times. Concatenating all `text` values yields the full answer.
      properties:
        text:
          type: string

    StreamDoneEvent:
      type: object
      required: [assistantMessage]
      description: Terminal success event; the persisted assistant message (`status = "completed"`).
      properties:
        assistantMessage:
          $ref: '#/components/schemas/Message'

    StreamFailedEvent:
      type: object
      required: [assistantMessage, message]
      description: |
        Terminal failure event. The partial assistant message has been
        persisted with `status = "failed"` (provider/network failure) or
        `status = "interrupted"` (generation orphaned by a server restart,
        surfaced via the reconnect stream). Message is generic Persian text;
        never contains provider details.

        NOT emitted on client disconnect — the disconnector cannot receive
        it, and a disconnect does not fail the generation anyway. The row
        completes in the DB and is recoverable via the reconnect stream.
      properties:
        assistantMessage:
          $ref: '#/components/schemas/Message'
        message:
          type: string
          example: 'سرویس هوش مصنوعی موقتاً در دسترس نیست. لطفاً دوباره تلاش کنید.'

    StreamSnapshotEvent:
      type: object
      required: [assistantMessage]
      description: |
        Reconnect-stream only; always the first event. Carries the assistant
        row with the FULL content accumulated so far — the client REPLACES its
        copy with this (never appends). Every later delta is guaranteed to be
        new: a token is either in the snapshot or in a delta, never both.
      properties:
        assistantMessage:
          $ref: '#/components/schemas/Message'

    # ---- Error contract ----
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - EMAIL_ALREADY_EXISTS
                - MODEL_INACTIVE
                - NO_DEFAULT_MODEL
                - DEFAULT_MODEL_PROTECTED
                - UNAUTHENTICATED
                - FORBIDDEN
                - RESOURCE_NOT_FOUND
                - INTERNAL_ERROR
              description: |
                Stable machine-readable code. Status-code mapping:
                400 → VALIDATION_ERROR | MODEL_INACTIVE | NO_DEFAULT_MODEL | DEFAULT_MODEL_PROTECTED;
                401 → UNAUTHENTICATED; 403 → FORBIDDEN; 404 → RESOURCE_NOT_FOUND;
                409 → EMAIL_ALREADY_EXISTS; 500 → INTERNAL_ERROR.
            message:
              type: string
              description: Persian, user-displayable message (safe; no technical detail).

    # ---- Usage & quota ----
    UsageSummary:
      type: object
      required: [plan, quota, today]
      properties:
        plan:
          type: string
          enum: [free, premium]
        quota:
          nullable: true
          description: Null for admins (they bypass quotas).
          type: object
          required: [dailyMessages, dailyTokens]
          properties:
            dailyMessages:
              type: integer
              description: Env-configured daily message limit for the plan.
            dailyTokens:
              type: integer
              nullable: true
              description: Optional daily token cap; null ⇒ unlimited.
        today:
          type: object
          required: [used, remaining, tokens]
          properties:
            used:
              type: integer
              description: Accepted turns today (failed turns excluded).
            remaining:
              type: integer
            tokens:
              type: integer
              description: Input + output tokens recorded today (failed excluded).

    AdminUser:
      type: object
      required: [id, email, role, plan, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        plan: { type: string, enum: [free, premium] }
        createdAt: { type: string, format: date-time }

    AdminUsageSummary:
      type: object
      required: [days, totals, perDay, perModel, perUser]
      properties:
        days: { type: integer }
        totals:
          type: object
          required: [turns, failedTurns, inputTokens, outputTokens, totalTokens, estimatedCost]
          properties:
            turns: { type: integer }
            failedTurns: { type: integer }
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            totalTokens:
              type: integer
              description: Derived (input + output) — never stored separately.
            estimatedCost:
              type: number
              description: Toman; 0 when no turn had pricing.
        perDay:
          type: array
          items:
            type: object
            required: [date, turns, tokens, cost]
            properties:
              date: { type: string, format: date }
              turns: { type: integer }
              tokens: { type: integer }
              cost: { type: number }
        perModel:
          type: array
          items:
            type: object
            required: [turns, tokens, cost]
            properties:
              modelId: { type: string, format: uuid, nullable: true }
              modelName: { type: string, nullable: true }
              provider: { type: string, nullable: true }
              turns: { type: integer }
              tokens: { type: integer }
              cost: { type: number }
        perUser:
          type: array
          items:
            type: object
            required: [userId, email, turns, tokens, cost]
            properties:
              userId: { type: string, format: uuid }
              email: { type: string }
              turns: { type: integer }
              tokens: { type: integer }
              cost: { type: number }

    # ---- Billing (day 9-10) ----
    Plan:
      type: object
      required: [id, slug, name, price, currency, billingPeriod, dailyMessageQuota, webSearch, thinking, fileProcessing, isActive]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, description: Unique stable identifier; immutable after creation. }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: string, description: numeric(14,6) as string; server-authoritative. }
        currency: { type: string, example: IRT }
        billingPeriod: { type: string, enum: [monthly, yearly], description: 30/365-day period. }
        dailyMessageQuota: { type: integer, minimum: 1 }
        dailyTokenQuota: { type: integer, nullable: true, description: null = unlimited. }
        allowedModelIds: { type: array, items: { type: string, format: uuid }, nullable: true, description: null = all models allowed. }
        webSearch: { type: boolean }
        thinking: { type: boolean }
        fileProcessing: { type: boolean }
        isActive: { type: boolean, description: Deactivated = not purchasable; existing subscriptions keep running. }

    PlanSnapshot:
      type: object
      description: Plan facts frozen at purchase time (INV-07 historical integrity).
      required: [planId, planSlug, planName, price, currency, billingPeriod]
      properties:
        planId: { type: string, format: uuid }
        planSlug: { type: string }
        planName: { type: string }
        price: { type: string }
        currency: { type: string }
        billingPeriod: { type: string, enum: [monthly, yearly] }

    UserPaymentView:
      type: object
      required: [id, planId, amount, currency, status, trackingId, plan, createdAt]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        amount: { type: string, description: Server-resolved from the Plan row. }
        currency: { type: string }
        status: { type: string, enum: [pending, success, failed, cancelled] }
        trackingId: { type: string, example: trk_0b9e6c1a-... }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        succeededAt: { type: string, format: date-time, nullable: true }
        plan:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            billingPeriod: { type: string, enum: [monthly, yearly] }

    AdminPayment:
      allOf:
        - $ref: '#/components/schemas/UserPaymentView'
        - type: object
          properties:
            userId: { type: string, format: uuid }
            planSnapshot:
              $ref: '#/components/schemas/PlanSnapshot'
            scenario: { type: string, nullable: true, description: Simulator scenario or 'webhook'/'user-cancelled'. }

    SubscriptionInfo:
      type: object
      required: [id, planSlug, planName, status, currentPeriodStart, currentPeriodEnd]
      properties:
        id: { type: string, format: uuid }
        planSlug: { type: string }
        planName: { type: string }
        status: { type: string, enum: [pending, active, expired, cancelled] }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        sourcePaymentId: { type: string, format: uuid, nullable: true }

    AdminSubscriptionRow:
      allOf:
        - $ref: '#/components/schemas/SubscriptionInfo'
        - type: object
          properties:
            userId: { type: string, format: uuid }
            planId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    Entitlements:
      type: object
      description: Server-resolved access policy — the ONLY source the backend trusts (INV-05).
      required: [tier, planSlug, planName, quota, features, allowedModelIds]
      properties:
        tier: { type: string, enum: [free, premium] }
        planSlug: { type: string }
        planName: { type: string }
        subscriptionId: { type: string, format: uuid, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        quota:
          type: object
          properties:
            dailyMessages: { type: integer }
            dailyTokens: { type: integer, nullable: true }
        features:
          type: object
          properties:
            webSearch: { type: boolean }
            thinking: { type: boolean }
            fileProcessing: { type: boolean }
        allowedModelIds: { type: array, items: { type: string, format: uuid }, nullable: true }

    SubscriptionOverview:
      type: object
      required: [entitlements, subscription]
      properties:
        entitlements:
          $ref: '#/components/schemas/Entitlements'
        subscription:
          $ref: '#/components/schemas/SubscriptionInfo'
          nullable: true

    SimulateResultRow:
      type: object
      properties:
        status: { type: string, enum: [processed, duplicate, ignored] }
        reason: { type: string, nullable: true }

    SimulateResponse:
      type: object
      required: [scenario, payment]
      properties:
        scenario: { type: string }
        payment:
          $ref: '#/components/schemas/UserPaymentView'
        results:
          type: array
          nullable: true
          description: One entry per dispatched webhook (null = timeout, no callback).
          items:
            $ref: '#/components/schemas/SimulateResultRow'

    WebhookPayload:
      type: object
      required: [eventId, eventType, payload]
      properties:
        eventId: { type: string, description: Gateway event id — unique per provider (idempotency key). }
        eventType: { type: string, enum: [payment.succeeded, payment.failed, payment.cancelled] }
        payload:
          type: object
          properties:
            paymentId: { type: string, format: uuid }
            trackingId: { type: string }
            amount: { type: string }
            currency: { type: string }
            failureReason: { type: string }

    WebhookResult:
      type: object
      required: [received, status]
      properties:
        received: { type: boolean, const: true }
        status: { type: string, enum: [processed, duplicate, ignored] }
        reason: { type: string, nullable: true, description: Why an event was ignored (stale state / unknown type / missing reference). }

    CreatePlanPayload:
      type: object
      required: [slug, name, price, billingPeriod, dailyMessageQuota, webSearch, thinking, fileProcessing]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        price: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 10, default: IRT }
        billingPeriod: { type: string, enum: [monthly, yearly] }
        dailyMessageQuota: { type: integer, minimum: 1, maximum: 1000000 }
        dailyTokenQuota: { type: integer, minimum: 1, nullable: true }
        allowedModelIds: { type: array, items: { type: string, format: uuid }, nullable: true, maxItems: 200 }
        webSearch: { type: boolean, default: false }
        thinking: { type: boolean, default: false }
        fileProcessing: { type: boolean, default: false }

    UpdatePlanPayload:
      type: object
      description: Partial; `slug` is deliberately NOT updatable.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        price: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 10 }
        billingPeriod: { type: string, enum: [monthly, yearly] }
        dailyMessageQuota: { type: integer, minimum: 1, maximum: 1000000 }
        dailyTokenQuota: { type: integer, minimum: 1, nullable: true }
        allowedModelIds: { type: array, items: { type: string, format: uuid }, nullable: true, maxItems: 200 }
        webSearch: { type: boolean }
        thinking: { type: boolean }
        fileProcessing: { type: boolean }

    AuditLogEntry:
      type: object
      required: [id, eventType, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, example: subscription.activated }
        actorId: { type: string, format: uuid, nullable: true }
        actor: { type: string, nullable: true, description: Human-readable actor label (email) or null for system/webhook. }
        target: { type: string, nullable: true, example: payment:7c9e6679-7425-40de-944b-e07fc1f90ae7 }
        correlationId: { type: string, nullable: true }
        metadata: { type: object, description: Structured context — never contains secrets or credentials. }
        createdAt: { type: string, format: date-time }
    Theme:
      type: object
      description: |
        One row per theme in the server-side registry. `id` is a STABLE
        REGISTRY KEY (not a UUID) shared with the frontend `data-theme`
        attribute. Availability is admin state; visual definitions live in
        the frontend registry.
      required: [id, name, enabled, isDefault, sortOrder]
      properties:
        id: { type: string, enum: [light, dark, midnight] }
        name: { type: string, description: Admin-editable display name (Persian). }
        description: { type: string, nullable: true }
        enabled: { type: boolean, description: Users may select this theme; enforced on every read/write path. }
        isDefault: { type: boolean, description: Exactly one true; always enabled (invariant). }
        sortOrder: { type: integer, description: Ascending display order. }
        metadata: { type: object, nullable: true, description: Reserved for per-theme display metadata. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserPreferences:
      type: object
      required: [themeId]
      properties:
        themeId:
          type: string
          nullable: true
          enum: [light, dark, midnight, null]
          description: Resolved preference; null = never chosen (client keeps its device-local choice).

    UpdateThemePayload:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 255, nullable: true }
        sortOrder: { type: integer, minimum: 0 }

    UpdateThemeStatusPayload:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    ReorderThemesPayload:
      type: object
      required: [themeIds]
      properties:
        themeIds:
          type: array
          items: { type: string, enum: [light, dark, midnight] }
          minItems: 3
          maxItems: 3
          description: Complete ordered list of ALL registry ids — duplicates or partial lists are refused.
